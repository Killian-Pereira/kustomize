apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic-deploy
spec:
  template:
    spec:
      containers:
        - name: springboot
          env:
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: /tp9
          startupProbe:
            httpGet:
              path: /tp9/actuator/health/readiness
          livenessProbe:
            httpGet:
              path: /tp9/actuator/health/liveness
          readinessProbe:
            httpGet:
              path: /tp9/actuator/health/readiness
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clinic-ingress
spec:
  rules:
    - http:
        paths:
          - path: /tp9
            pathType: Prefix
            backend:
              service:
                name: clinic-service
                port:
                  number: 8080

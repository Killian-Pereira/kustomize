apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../base

images:
- name: ghcr.io/killian-pereira/spring-petclinic
  newTag: latest
- name: spring-petclinic
  newName: ghcr.io/killian-pereira/spring-petclinic
  newTag: 80e99dc9132961767c101b2ccd2303c41019068c

patches:
- path: replicas.yaml
  target:
    group: apps
    kind: Deployment
    name: clinic-deploy
    version: v1
- path: patch-routing.yaml
